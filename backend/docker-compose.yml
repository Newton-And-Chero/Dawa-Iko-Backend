services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calle
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the slim base image — urllib needs nothing extra.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: .
    command: uv run celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

  beat:
    build: .
    # A pidfile gives the healthcheck something concrete to probe — Celery
    # Beat has no built-in inspect/ping (that's a worker-side RPC).
    command: uv run celery -A app.workers.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    env_file:
      - .env
    volumes:
      - .:/app:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -e /proc/$(cat /tmp/celerybeat.pid)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db_data:
  redis_data:
